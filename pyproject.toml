[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "as-report"
version = "0.1.0"
description = "A/S issue analysis report generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "openpyxl",
  "jinja2",
  "plotly",
  "python-dateutil",
  "xlrd",
  "streamlit",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0.2,<2"
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[project.scripts]
as-report = "as_report.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_chatgpt_handoff", "MD", "archive", "tmp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
as_report = [
  "presentation/*.ps1",
  "resources/*.pptx",
  "resources/*.png",
  "templates/*.html",
  "templates/report_tool/*.json"
]
